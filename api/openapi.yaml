                            $ref: '#/components/schemas/OidcUriRequest'
                required: true
            responses:
                "200":
                    description: OID4VCI credential offer processed successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Malformed request URI
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Protocol exchange failed
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Process OID4VCI credential offer
            tags:
                - Verifiable Credentials & Exchanges
    /api/v1/ssi-auth/wallet/oid4vp:
        post:
            description: Handles an inbound OpenID for Verifiable Presentations (OID4VP) presentation request URI.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OidcUriRequest'
                required: true
            responses:
                "200":
                    description: OID4VP presentation processed successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Malformed presentation request
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Presentation exchange failed
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Process OID4VP presentation request
            tags:
                - Verifiable Credentials & Exchanges
    /api/v1/ssi-auth/wallet/participants:
        post:
            description: Provisions a new tenant/participant context in IdentityHub for multi-tenant deployments.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateParticipantRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ParticipantResponse'
                    description: Participant context created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid participant definition
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Participant context ID collision
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Provision participant context
            tags:
                - Participant Contexts
    /api/v1/ssi-auth/wallet/participants/{id}:
        get:
            description: Retrieves configuration, DID, and activation state for a participant context in IdentityHub.
            parameters:
                - description: Participant context ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ParticipantResponse'
                    description: Participant context details
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Participant not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Get participant context
            tags:
                - Participant Contexts
    /api/v1/ssi-auth/wallet/participants/{id}/state:
        post:
            description: Toggles active or suspended status for a participant context.
            parameters:
                - description: Participant context ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ParticipantStateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ParticipantResponse'
                    description: Participant state updated
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid state request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Participant not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Update participant activation state
            tags:
                - Participant Contexts
    /api/v1/ssi-auth/wallet/participants/{id}/token:
        post:
            description: Rotates and re-issues the API token for a participant context.
            parameters:
                - description: Participant context ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ParticipantTokenResponse'
                    description: Minted participant token
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Participant not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Regenerate participant API token
            tags:
                - Participant Contexts
        put:
            description: Updates or overrides the in-memory API token for a participant context.
            parameters:
                - description: Participant context ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateTokenRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    message:
                                        example: token updated in memory
                                        type: string
                                    participantId:
                                        example: participant-acme
                                        type: string
                                type: object
                    description: Token update confirmation
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Missing token
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Update participant API token in memory
            tags:
                - Participant Contexts
    /api/v1/ssi-auth/wallet/vcs:
        get:
            description: Queries all Verifiable Credentials stored in the wallet, optionally filtering by credential type (e.g. DataSpaceParticipant).
            parameters:
                - description: Filter by Verifiable Credential type name
                  in: query
                  name: type
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CredentialResponse'
                                type: array
                    description: Array of Verifiable Credentials
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: List Verifiable Credentials
            tags:
                - Verifiable Credentials & Exchanges
    /docs:
        get:
            description: Serves interactive Swagger UI documentation for browsing, testing, and exploring Alexandria's HTTP surface.
            responses:
                "200":
                    content:
                        text/html:
                            schema:
                                type: string
                    description: Swagger UI single-page interface
            summary: Interactive API Documentation (Swagger UI)
            tags:
                - OpenAPI & Documentation
    /healthz:
        get:
            description: Basic liveness probe confirming the Alexandria HTTP process is alive and responsive.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: Process is live
            summary: Liveness probe
            tags:
                - Root & Probes
    /openapi.json:
        get:
            description: Returns the complete OpenAPI 3.0 specification in JSON format.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                    description: OpenAPI 3.0 JSON specification
            summary: OpenAPI JSON Specification
            tags:
                - OpenAPI & Documentation
    /openapi.yaml:
        get:
            description: Returns the complete canonical OpenAPI 3.0 specification in YAML format.
            responses:
                "200":
                    content:
                        application/yaml:
                            schema:
                                type: string
                    description: OpenAPI 3.0 YAML specification
            summary: OpenAPI YAML Specification
            tags:
                - OpenAPI & Documentation
    /readyz:
        get:
            description: Kubernetes readiness probe reporting aggregated readiness of all configured subsystems (PostgreSQL database pool, delegated wallet link, and Zitadel OIDC verifier).
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: All subsystems ready to serve
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: One or more subsystems degraded or unavailable
            summary: Readiness probe
            tags:
                - Root & Probes
servers:
    - description: Current Origin
      url: /
    - description: Local Development (Caddy TLS Proxy - ADR 0005)
      url: https://alexandria.127.0.0.1.nip.io:8443
    - description: Internal Cleartext Port
      url: http://127.0.0.1:1234
tags:
    - description: System health probes, readiness checks, and origin-level W3C discovery endpoints.
      name: Root & Probes
    - description: Machine-readable OpenAPI specifications and interactive Swagger UI documentation.
      name: OpenAPI & Documentation
    - description: Node-terminated OpenID Connect (OIDC) with Zitadel, PKCE flow, and encrypted session management (auth-proxy context, ADR 0004).
      name: Authentication & Sessions
    - description: Handshake, status verification, and metadata for delegated wallet backends (ssi-auth context, ADR 0007).
      name: Wallet & Identity Lifecycle
    - description: Asymmetric keypair lifecycle, import, rotation, and revocation delegated to external wallets (ADR 0003).
      name: Key Custody & Rotation
    - description: W3C DID resolution, creation (did:jwk, did:web), verification methods, service endpoints, and publication.
      name: Decentralized Identifiers (DIDs)
    - description: Verifiable Credentials storage, query, deletion, and protocol processing (OID4VCI offers and OID4VP presentation requests).
      name: Verifiable Credentials & Exchanges
    - description: Asynchronous credential issuance requests and polling via the Dataspace Credential Protocol.
      name: Dataspace Credential Protocol (DCP)
    - description: Multi-tenant participant contexts and API token management in Eclipse EDC IdentityHub.
      name: Participant Contexts
