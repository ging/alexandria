components:
    schemas:
        CreateParticipantRequest:
            description: Payload for provisioning a new participant context in IdentityHub.
            properties:
                active:
                    description: Whether participant is active immediately
                    example: true
                    type: boolean
                did:
                    description: DID associated with participant
                    example: did:web:acme.org
                    type: string
                id:
                    description: Unique participant context ID
                    example: participant-acme
                    type: string
                key:
                    $ref: '#/components/schemas/KeyDescriptorRequest'
            required:
                - id
                - did
                - active
            type: object
        CredentialResponse:
            description: Public representation of a stored Verifiable Credential.
            properties:
                addedOn:
                    description: Storage timestamp
                    format: date-time
                    type: string
                credential:
                    description: Parsed W3C Verifiable Credential structure
                    type: object
                format:
                    description: Credential format
                    example: VC1_0_JWT
                    type: string
                holderDid:
                    example: did:web:alexandria.example.org
                    type: string
                id:
                    description: Credential ID
                    example: vc-membership-01
                    type: string
                issuanceDate:
                    description: Issuance date
                    format: date-time
                    type: string
                issuerDid:
                    example: did:web:trust-anchor.dataspace.org
                    type: string
                parsedDocument:
                    type: object
                participantContextId:
                    example: default
                    type: string
                rawVc:
                    description: Raw JWT or JSON string
                    type: string
                types:
                    example:
                        - VerifiableCredential
                        - DataSpaceParticipant
                    items:
                        type: string
                    type: array
                validUntil:
                    description: Expiration date
                    format: date-time
                    type: string
                vcBody:
                    description: Raw or structured VC claims body
                vcFormat:
                    example: VC1_0_JWT
                    type: string
                vcType:
                    description: Primary credential type name
                    example: DataSpaceParticipant
                    type: string
            required:
                - id
                - rawVc
                - format
                - vcType
                - holderDid
                - issuerDid
                - addedOn
            type: object
        DcpCredentialDescriptorRequest:
            description: Specific credential format and type requested via DCP.
            properties:
                format:
                    example: VC1_0_JWT
                    type: string
                id:
                    example: desc-1
                    type: string
                type:
                    example: DataSpaceParticipant
                    type: string
            required:
                - format
                - type
            type: object
        DcpCredentialRequest:
            description: Dataspace Credential Protocol issuance request payload.
            properties:
                credentials:
                    items:
                        $ref: '#/components/schemas/DcpCredentialDescriptorRequest'
                    type: array
                format:
                    example: VC1_0_JWT
                    type: string
                holderPid:
                    description: Holder participant identifier
                    example: holder-pid-123
                    type: string
                issuerDid:
                    description: Issuer DID
                    example: did:web:issuer.dataspace.org
                    type: string
                issuerUrl:
                    description: Issuer service endpoint
                    example: https://issuer.dataspace.org
                    format: uri
                    type: string
                types:
                    example:
                        - DataSpaceParticipant
                    items:
                        type: string
                    type: array
            required:
                - issuerDid
            type: object
        DcpRequestResponse:
            description: Receipt response acknowledging an accepted DCP request.
            properties:
                requestId:
                    description: Asynchronous request tracking ID
                    example: dcp-req-923847293
                    type: string
            required:
                - requestId
            type: object
        DcpStatusResponse:
            description: Status and execution result of an asynchronous DCP request.
            properties:
                error:
                    description: Error diagnostic if failed
                    type: string
                requestId:
                    example: dcp-req-923847293
                    type: string
                status:
                    description: Processing status (e.g. REQUESTED, PROCESSING, ISSUED, FAILED)
                    example: ISSUED
                    type: string
            required:
                - requestId
                - status
            type: object
        DidBuilderRequest:
            description: Method configuration for provisioning a new DID.
            properties:
                domain:
                    description: Domain name for did:web builder
                    example: alexandria.127.0.0.1.nip.io
                    type: string
                method:
                    description: Target DID method
                    enum:
                        - jwk
                        - web
                    example: web
                    type: string
                path:
                    description: Optional path component for did:web
                    example: identity
                    type: string
                pem:
                    description: PEM key material for did:jwk builder
                    type: string
                port:
                    description: Optional port for did:web
                    example: "8443"
                    type: string
            type: object
        DidDocument:
            description: W3C compliant Decentralized Identifier Document.
            properties:
                assertionMethod:
                    items:
                        type: string
                    type: array
                authentication:
                    items:
                        type: string
                    type: array
                id:
                    example: did:web:alexandria.127.0.0.1.nip.io:8443
                    type: string
                service:
                    items:
                        type: object
                    type: array
                verificationMethod:
                    items:
                        type: object
                    type: array
            required:
                - id
            type: object
        DidIdResponse:
            description: DID identifier string wrapper.
            properties:
                did:
                    description: Decentralized Identifier URI
                    example: did:jwk:eyJjcnYiOiJzZWNwMjU2azEi...
                    type: string
            required:
                - did
            type: object
        DidResponse:
            description: Public representation of a wallet-managed DID record.
            properties:
                alias:
                    description: Friendly local alias
                    example: default-did
                    type: string
                default:
                    description: Whether this DID is the primary wallet identity
                    example: true
                    type: boolean
                defaultKeyFragment:
                    description: Primary verification method fragment
                    example: '#key-1'
                    type: string
                didDocument:
                    $ref: '#/components/schemas/DidDocument'
                id:
                    description: DID identifier string
                    example: did:web:alexandria.127.0.0.1.nip.io:8443
                    type: string
                keys:
                    description: Bound verification keys
                    items:
                        $ref: '#/components/schemas/KeyBinding'
                    type: array
                method:
                    description: DID method (e.g. web, jwk)
                    example: web
                    type: string
            required:
                - id
                - method
                - default
                - keys
            type: object
        DidServiceRequest:
            description: Service endpoint definition to embed in a DID document.
            properties:
                id:
                    description: Service endpoint fragment identifier
                    example: '#credential-service'
                    type: string
                serviceEndpoint:
                    description: Target service URI
                    example: https://alexandria.example.org/credentials
                    format: uri
                    type: string
                type:
                    description: Service type (e.g. CredentialService, LinkedDomains)
                    example: CredentialService
                    type: string
            required:
                - type
                - serviceEndpoint
            type: object
        DidStateResponse:
            description: DID publication state report.
            properties:
                did:
                    description: DID identifier
                    example: did:web:alexandria.example.org
                    type: string
                state:
                    description: Publication state (published, unpublished, draft)
                    example: published
                    type: string
            required:
                - did
                - state
            type: object
        ErrorResponse:
            description: Standard RFC 7807 problem detail response emitted on HTTP errors.
            properties:
                error:
                    description: Human-readable error explanation
                    example: entity not found
                    type: string
                field:
                    description: Offending request field when invalid
                    example: alias
                    type: string
                originalResponse:
                    $ref: '#/components/schemas/OriginalResponse'
            required:
                - error
            type: object
        HealthResponse:
            description: System health and readiness status payload.
            properties:
                checks:
                    additionalProperties:
                        type: string
                    description: Subsystem readiness breakdown by name
                    example:
                        database: ok
                        openapi: ok
                        wallet: ok
                    type: object
                status:
                    description: Overall service health status ('ok' or 'not_ready')
                    example: ok
                    type: string
            required:
                - status
            type: object
        KeyBinding:
            description: Fragment identifier referencing a key binding in a DID document.
            properties:
                fragment:
                    example: '#key-1'
                    type: string
            required:
                - fragment
            type: object
        KeyDescriptorRequest:
            description: Key generation or public key binding options during participant provisioning.
            properties:
                keyGeneratorParams:
                    type: object
                keyId:
                    example: key-tenant-1
                    type: string
                privateKeyAlias:
                    type: string
                properties:
                    type: object
                publicKeyJwk:
                    type: object
                publicKeyPem:
                    type: string
                type:
                    example: Ed25519
                    type: string
            type: object
        KeyResponse:
            description: Public metadata of a cryptographic keypair held in the wallet.
            properties:
                alias:
                    description: Optional alias
                    example: primary-signing-key
                    type: string
                createdAt:
                    description: Key registration timestamp
                    format: date-time
                    type: string
                crv:
                    description: Cryptographic curve (e.g. secp256k1, P-256, Ed25519)
                    example: secp256k1
                    type: string
                defaultPair:
                    description: Whether this is the default keypair
                    type: boolean
                id:
                    description: Key identifier
                    example: key-secp256k1-1
                    type: string
                keyContext:
                    description: Internal context reference
                    type: string
                kty:
                    description: Key type (e.g. EC, OKP, RSA)
                    example: EC
                    type: string
                privateKeyAlias:
                    description: Custody reference alias in external HSM or Vault
                    type: string
                serializedPublicKey:
                    description: Public key serialization in PEM or base64
                    type: string
                state:
                    description: Key lifecycle state (Active, Rotated, Revoked)
                    example: Active
                    type: string
            required:
                - id
                - kty
                - createdAt
            type: object
        LoginResponse:
            description: Payload returned when login is requested as JSON instead of browser redirect.
            properties:
                authorization_url:
                    description: Zitadel OIDC authorization URL with PKCE parameters
                    example: https://auth.127.0.0.1.nip.io:8443/oauth/v2/authorize?client_id=alexandria&...
                    format: uri
                    type: string
            required:
                - authorization_url
            type: object
        LogoutResponse:
            description: Payload returned when logout is requested as JSON instead of browser redirect.
            properties:
                end_session_url:
                    description: Zitadel end-session URL for client redirection
                    example: https://auth.127.0.0.1.nip.io:8443/oidc/v1/end_session?post_logout_redirect_uri=...
                    format: uri
                    type: string
            type: object
        MachineTokenRequest:
            description: Client credentials payload for machine-to-machine OAuth2 token minting.
            properties:
                client_id:
                    description: Registered service account client ID
                    example: connector-client-01
                    type: string
                client_secret:
                    description: Service account client secret
                    example: secret-value-xyz
                    format: password
                    type: string
                scope:
                    description: Requested OAuth2 scopes
                    example: openid profile dataspace:read
                    type: string
            required:
                - client_id
                - client_secret
            type: object
        OidcUriRequest:
            description: Protocol request URI payload for OID4VCI or OID4VP exchanges.
            properties:
                uri:
                    description: Decentralized protocol offer or presentation request URI
                    example: openid-credential-offer://?credential_offer_uri=https%3A%2F%2Fissuer.org%2Foffer%2F123
                    type: string
            required:
                - uri
            type: object
        OriginalResponse:
            description: Diagnostic details forwarded from external wallet providers (Fafnir or IdentityHub).
            properties:
                body:
                    description: Raw payload response from upstream
                path:
                    description: Upstream request path
                    example: /api/identity/v1
                    type: string
                provider:
                    description: Upstream wallet provider name
                    example: identityhub
                    type: string
                statusCode:
                    description: HTTP status received from upstream
                    example: 502
                    type: integer
            required:
                - provider
                - statusCode
            type: object
        ParticipantResponse:
            description: Participant context metadata in IdentityHub.
            properties:
                active:
                    example: true
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                did:
                    example: did:web:acme.org
                    type: string
                id:
                    example: participant-acme
                    type: string
                roles:
                    example:
                        - admin
                    items:
                        type: string
                    type: array
            required:
                - id
                - did
                - active
                - createdAt
            type: object
        ParticipantStateRequest:
            description: Payload for toggling active state of a participant context.
            properties:
                active:
                    description: Active state flag
                    example: true
                    type: boolean
            required:
                - active
            type: object
        ParticipantTokenResponse:
            description: Minted API authorization token for a participant context.
            properties:
                token:
                    description: API authorization token
                    example: apiKey_398472938472394
                    type: string
            required:
                - token
            type: object
        RegisterDidRequest:
            description: Payload for creating and provisioning a new DID in the wallet.
            properties:
                alias:
                    example: dataspace-node-identity
                    type: string
                builder:
                    $ref: '#/components/schemas/DidBuilderRequest'
                keys:
                    description: List of key IDs to bind as verification methods
                    example:
                        - key-secp256k1-1
                    items:
                        type: string
                    type: array
                service:
                    items:
                        $ref: '#/components/schemas/DidServiceRequest'
                    type: array
            required:
                - builder
            type: object
        RegisterKeyRequest:
            description: Payload for importing or registering an asymmetric keypair in the wallet.
            properties:
                alias:
                    example: identityhub-signing-key
                    type: string
                id:
                    description: Optional assigned key ID
                    example: key-2026-09
                    type: string
                jwk:
                    description: JWK representation of key material
                pem:
                    description: PEM-encoded private key (with public key) to import
                    type: string
            type: object
        RotateKeyRequest:
            description: Parameters for cryptographic key rotation.
            properties:
                duration:
                    description: Overlap validity duration before prior key is retired (e.g. 24h, 720h)
                    example: 720h
                    type: string
            type: object
        ServiceEndpointRequest:
            description: Payload for adding a service endpoint to a DID document.
            properties:
                id:
                    example: '#service-endpoint-1'
                    type: string
                type:
                    example: LinkedDomains
                    type: string
                url:
                    example: https://alexandria.example.org
                    format: uri
                    type: string
            required:
                - id
                - type
                - url
            type: object
        SessionResponse:
            description: Public projection of the caller identity as established by the verified token or cookie.
            properties:
                email:
                    description: Email address
                    example: admin@example.com
                    format: email
                    type: string
                expires_at:
                    description: Timestamp when session or token expires
                    format: date-time
                    type: string
                machine:
                    description: True if authenticated via client credentials grant
                    example: false
                    type: boolean
                name:
                    description: Display name
                    example: Alexandria Admin
                    type: string
                organization:
                    description: Organization context
                    example: org_alexandria
                    type: string
                roles:
                    description: Assigned project roles
                    example:
                        - admin
                        - editor
                    items:
                        type: string
                    type: array
                scopes:
                    description: Token scopes
                    example:
                        - openid
                        - profile
                        - email
                    items:
                        type: string
                    type: array
                subject:
                    description: Zitadel user subject ID
                    example: "213948293847293"
                    type: string
                username:
                    description: Username
                    example: admin@alexandria.auth.127.0.0.1.nip.io
                    type: string
            required:
                - subject
                - roles
                - scopes
                - machine
            type: object
        StoreCredentialContainerRequest:
            description: Wrapper container for raw Verifiable Credential data.
            properties:
                credential:
                    description: Parsed credential JSON document
                    type: object
                format:
                    description: VC format descriptor
                    example: VC1_0_JWT
                    type: string
                rawVc:
                    description: Encoded JWT or JSON string of the VC
                    type: string
            required:
                - rawVc
            type: object
        StoreCredentialRequest:
            description: Payload for storing a Verifiable Credential in the wallet.
            properties:
                credential:
                    description: Decoded credential payload
                    type: object
                format:
                    description: Credential format
                    example: VC1_0_JWT
                    type: string
                id:
                    description: Unique credential identifier
                    example: vc-membership-01
                    type: string
                participantContextId:
                    description: Participant context ID in IdentityHub
                    example: default
                    type: string
                payload:
                    type: object
                rawVc:
                    description: Raw string representation of the credential
                    type: string
                verifiableCredentialContainer:
                    $ref: '#/components/schemas/StoreCredentialContainerRequest'
            required:
                - id
            type: object
        TokenResponse:
            description: Minted OAuth 2.0 access token response.
            properties:
                access_token:
                    description: Signed JWT access token
                    example: eyJhbGciOiJSUzI1NiIs...
                    type: string
                expires_in:
                    description: Token lifetime in seconds
                    example: 3600
                    type: integer
                scope:
                    description: Granted scopes
                    example: openid profile
                    type: string
                token_type:
                    description: Token type (Bearer)
                    example: Bearer
                    type: string
            required:
                - access_token
                - token_type
                - expires_in
            type: object
        UpdateTokenRequest:
            description: Payload for overriding a participant context API token in memory.
            properties:
                token:
                    description: New in-memory API token
                    example: apiKey_custom_override
                    type: string
            required:
                - token
            type: object
        WalletInfoResponse:
            description: High-level metadata and identities from the delegated wallet backend.
            properties:
                createdAt:
                    format: date-time
                    type: string
                dids:
                    items:
                        $ref: '#/components/schemas/DidResponse'
                    type: array
                id:
                    example: wallet-default
                    type: string
                name:
                    example: Alexandria Sovereign Wallet
                    type: string
            required:
                - id
                - name
                - createdAt
                - dids
            type: object
    securitySchemes:
        BearerAuth:
            bearerFormat: JWT
            description: OAuth 2.0 Bearer access token issued by Zitadel or machine credentials grant.
            scheme: bearer
            type: http
        SessionCookie:
            description: Sealed HttpOnly session cookie (encrypted, SameSite=Lax, Secure - ADR 0004 & ADR 0005).
            in: cookie
            name: alexandria_session
            type: apiKey
info:
    contact:
        name: Alexandria Team
        url: https://ging.github.io/alexandria
    description: |-
        Alexandria is a Vocabulary Hub engineered for sovereign dataspaces. It provides the single source of semantic truth to host, publish, and version domain ontologies, dereference semantic terms in real-time for dataspace connectors, and execute automated remote conformance tests.

        Key architectural pillars:
        - **Node-Terminated Authentication (ADR 0004)**: OIDC with PKCE via Zitadel issuing encrypted, HttpOnly session cookies.
        - **External Key Custody & Delegated Wallets (ADR 0003 & ADR 0007)**: Cryptographic private keys and signing operations reside in external wallets (supporting both Fafnir and Eclipse EDC IdentityHub).
        - **Unified Wallet Port**: Agnostic abstractions over DIDs, Verifiable Credentials, and keypairs.
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
    title: Alexandria Vocabulary Hub API
    version: 1.0.0
openapi: 3.0.3
paths:
    /.well-known/did.json:
        get:
            description: Public W3C DID Document resolving the node's decentralized identifier for did:web resolution without version prefixes.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DidDocument'
                    description: Public W3C DID Document
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: No DID document established or wallet not linked
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            summary: W3C DID Document
            tags:
                - Root & Probes
    /api/v1/auth/callback:
        get:
            description: Handles OAuth2 redirect callback from Zitadel, verifies state, exchanges authorization code for tokens using PKCE verifier, validates ID token nonce, and seals the HttpOnly session cookie.
            parameters:
                - description: Authorization code issued by Zitadel
                  in: query
                  name: code
                  required: true
                  schema:
                    type: string
                - description: OIDC state parameter for CSRF mitigation
                  in: query
                  name: state
                  required: true
                  schema:
                    type: string
                - description: Error code from Zitadel if authorization was denied
                  in: query
                  name: error
                  schema:
                    type: string
                - description: Set to 'json' to return session payload instead of 302 redirect
                  in: query
                  name: response
                  schema:
                    enum:
                        - json
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionResponse'
                    description: Authenticated session payload
                "302":
                    description: Redirects browser to return destination with sealed session cookie
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Missing code/state or state mismatch
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Identity provider refused or token verification failed
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            summary: OIDC authorization callback
            tags:
                - Authentication & Sessions
    /api/v1/auth/login:
        get:
            description: Initiates OpenID Connect authorization code flow with PKCE via Zitadel (ADR 0004). Generates cryptographic state and nonce, sets encrypted flow cookie, and redirects browser or returns JSON authorization URL.
            parameters:
                - description: OIDC prompt parameter (e.g. login, consent)
                  in: query
                  name: prompt
                  schema:
                    type: string
                - description: Username or email hint for the identity provider
                  in: query
                  name: login_hint
                  schema:
                    type: string
                - description: Target organization identifier in Zitadel
                  in: query
                  name: organization
                  schema:
                    type: string
                - description: Specific identity provider hint
                  in: query
                  name: idp
                  schema:
                    type: string
                - description: Safe relative path to redirect to after successful authentication
                  in: query
                  name: return_to
                  schema:
                    type: string
                - description: Set to 'json' to receive the authorization URL in a JSON payload instead of a 302 redirect
                  in: query
                  name: response
                  schema:
                    enum:
                        - json
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                    description: Authorization URL for programmatic callers
                "302":
                    description: Redirects browser to Zitadel authorization endpoint
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid login parameters or unsafe return URL
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            summary: Initiate OIDC authorization flow
            tags:
                - Authentication & Sessions
    /api/v1/auth/logout:
        post:
            description: Clears the encrypted session cookie on the node and revokes the refresh token at Zitadel. If supported, returns or redirects to provider end-session endpoint.
            parameters:
                - description: Set to 'json' to return end session URL payload instead of 302 redirect
                  in: query
                  name: response
                  schema:
                    enum:
                        - json
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LogoutResponse'
                    description: End-session URL for client redirection
                "302":
                    description: Redirects browser to Zitadel end-session URL
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - SessionCookie: []
            summary: Terminate user session
            tags:
                - Authentication & Sessions
    /api/v1/auth/refresh:
        post:
            description: Renews the access token and rotates the refresh token stored in the sealed session cookie via Zitadel's token endpoint.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionResponse'
                    description: Session renewed with new expiry
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: No active session or refresh token rejected by provider
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal error
            security:
                - SessionCookie: []
            summary: Refresh session token
            tags:
                - Authentication & Sessions
    /api/v1/auth/session:
        get:
            description: Returns subject, username, roles, and expiry of the caller as recognized by the node guard.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionResponse'
                    description: Active caller identity details
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthenticated caller
            security:
                - BearerAuth: []
                - SessionCookie: []
            summary: Current authenticated session
            tags:
