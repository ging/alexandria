            description: Reports aggregate readiness of all configured subsystems (database, wallet, identity provider).
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: All subsystems ready
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                    description: One or more subsystems not ready
            summary: Readiness probe
            tags:
                - System
