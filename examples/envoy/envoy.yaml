# Envoy as the L7 proxy of the connector, with alexandria-client (mode: validator) deciding on every DSP message.
#
# The ${NAME} placeholders are filled by `go run ./examples/envoy`; to use the file by hand, render it first:
#   LISTEN_ADDRESS=127.0.0.1 LISTEN_PORT=9080 CONNECTOR_HOST=127.0.0.1 CONNECTOR_PORT=8282 \
#   VALIDATOR_HOST=127.0.0.1 VALIDATOR_PORT=9085 envsubst < envoy.yaml > /tmp/envoy.yaml
static_resources:
  listeners:
    - name: dsp_ingress
      address:
        socket_address: { address: "${LISTEN_ADDRESS}", port_value: ${LISTEN_PORT} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: dsp_ingress
                route_config:
                  name: connector
                  virtual_hosts:
                    - name: connector
                      domains: ["*"]
                      routes:
                        # The connector serves DSP under /dsp; the validator sees the path before this rewrite.
                        - match: { prefix: "/" }
                          route: { cluster: connector, prefix_rewrite: "/dsp/" }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Fail closed: a message is never forwarded without a decision.
                      failure_mode_allow: false
                      status_on_error: { code: ServiceUnavailable }
                      # The gates validate the message body, so Envoy must buffer it and send it whole.
                      with_request_body:
                        max_request_bytes: 1048576
                        allow_partial_message: false
                      http_service:
                        # The check keeps the method and path of the original request.
                        server_uri:
                          uri: "http://${VALIDATOR_HOST}:${VALIDATOR_PORT}"
                          cluster: alexandria_validator
                          timeout: 2s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - { exact: content-type }
                              - { exact: traceparent }
                        authorization_response:
                          # forward-notice: the warning travels to the sender on the connector's response.
                          allowed_client_headers_on_success:
                            patterns:
                              - { exact: vhub-verdict }
                          # reject: status, body and these headers are relayed to the sender.
                          allowed_client_headers:
                            patterns:
                              - { exact: vhub-verdict }
                              - { exact: content-type }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: connector
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: connector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: "${CONNECTOR_HOST}", port_value: ${CONNECTOR_PORT} }
    - name: alexandria_validator
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: alexandria_validator
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: "${VALIDATOR_HOST}", port_value: ${VALIDATOR_PORT} }
