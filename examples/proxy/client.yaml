# alexandria-client as the L7 proxy of the connector (mode: proxy, the default).
# Counterparties call dsp-ingress; the client decides and forwards to upstreams.dsp itself.
mode: proxy
trust:
  hub: "https://127.0.0.1:8443"
  namespace: "demo"
  hub_did: "did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH"
  context: "https://127.0.0.1:8443/pub/_vhub/v1/context.jsonld"
upstreams:
  dsp: "http://127.0.0.1:8282/dsp"
listeners:
  dsp-ingress: { bind: "127.0.0.1:9080" }
  dsp-egress: { bind: "127.0.0.1:9081" }
  admin: { bind: "127.0.0.1:9090" }
rules:
  seed: "file:deploy/rules.seed.json"
events:
  sink: "file:var/client/events.jsonl"
