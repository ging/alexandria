apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-connector
  labels:
    app.kubernetes.io/name: fake-connector
    app.kubernetes.io/part-of: alexandria
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-connector
        app.kubernetes.io/part-of: alexandria
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: fake-connector
          image: ghcr.io/ging/alexandria/fake-connector:latest
          imagePullPolicy: IfNotPresent
          args:
            - -listen
            - 0.0.0.0:8282
          ports:
            - name: http
              containerPort: 8282
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-connector
  labels:
    app.kubernetes.io/name: fake-connector
    app.kubernetes.io/part-of: alexandria
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-connector
  ports:
    - name: http
      port: 8282
      targetPort: http
