apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: client-state
  labels:
    app.kubernetes.io/name: alexandria-client
    app.kubernetes.io/part-of: alexandria
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-client
  labels:
    app.kubernetes.io/name: alexandria-client
    app.kubernetes.io/part-of: alexandria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alexandria-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alexandria-client
        app.kubernetes.io/part-of: alexandria
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alexandria-client
          image: alexandria-client:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /etc/alexandria/start-client.sh
          env:
            - name: HUB_PUBLIC_URL
              value: https://hub.127.0.0.1.nip.io:8443
            - name: HUB_DID
              value: ""
            - name: CLIENT_NAMESPACE
              value: mobility
            - name: CLIENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: alexandria-credentials
                  key: CLIENT_DB_URL
          ports:
            - name: dsp-ingress
              containerPort: 9080
            - name: dsp-egress
              containerPort: 9081
            - name: admin
              containerPort: 9090
          volumeMounts:
            - name: client-config
              mountPath: /etc/alexandria/client.yaml
              subPath: client.yaml
              readOnly: true
            - name: client-scripts
              mountPath: /etc/alexandria/start-client.sh
              subPath: start-client.sh
              readOnly: true
            - name: hub-ca
              mountPath: /etc/alexandria/tls
              readOnly: true
            - name: client-state
              mountPath: /var/lib/alexandria/client
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: client-config
          configMap:
            name: alexandria-client-config
        - name: client-scripts
          configMap:
            name: alexandria-client-scripts
        - name: hub-ca
          secret:
            secretName: alexandria-ca
        - name: client-state
          persistentVolumeClaim:
            claimName: client-state
---
apiVersion: v1
kind: Service
metadata:
  name: alexandria-client
  labels:
    app.kubernetes.io/name: alexandria-client
    app.kubernetes.io/part-of: alexandria
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alexandria-client
  ports:
    - name: dsp-ingress
      port: 9080
      targetPort: dsp-ingress
      nodePort: 30080
    - name: dsp-egress
      port: 9081
      targetPort: dsp-egress
      nodePort: 30081
    - name: admin
      port: 9090
      targetPort: admin
      nodePort: 30090
