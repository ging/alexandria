apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alexandria-hub
  labels:
    app.kubernetes.io/name: alexandria-server
    app.kubernetes.io/part-of: alexandria
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hub.127.0.0.1.nip.io
      secretName: alexandria-tls
  rules:
    - host: hub.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alexandria-server
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alexandria-auth
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: alexandria
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.127.0.0.1.nip.io
      secretName: alexandria-tls
  rules:
    - host: auth.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
