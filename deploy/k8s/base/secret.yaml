# Local development credentials for kind (matches deploy/docker/.env.example).
# Replace with ExternalSecrets, SealedSecrets, or an out-of-band Secret in production.
apiVersion: v1
kind: Secret
metadata:
  name: alexandria-credentials
  labels:
    app.kubernetes.io/part-of: alexandria
type: Opaque
stringData:
  POSTGRES_USER: "alexandria"
  POSTGRES_PASSWORD: "alexandria"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  HUB_DB_URL: "postgres://alexandria:alexandria@postgres:5432/alexandria_hub?sslmode=disable"
  CLIENT_DB_URL: "postgres://alexandria:alexandria@postgres:5432/alexandria_client?sslmode=disable"
