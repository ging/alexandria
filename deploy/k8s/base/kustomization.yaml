apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alexandria

resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - server.yaml
  - ingress.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - config/init-databases.sql
  - name: keycloak-realm
    files:
      - config/alexandria-realm.json
  - name: alexandria-server-config
    files:
      - config/server.yaml
