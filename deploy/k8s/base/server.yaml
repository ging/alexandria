apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-data
  labels:
    app.kubernetes.io/name: alexandria-server
    app.kubernetes.io/part-of: alexandria
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-server
  labels:
    app.kubernetes.io/name: alexandria-server
    app.kubernetes.io/part-of: alexandria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alexandria-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alexandria-server
        app.kubernetes.io/part-of: alexandria
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-keycloak
          image: alexandria-server:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until curl -fsS http://keycloak:9000/health/ready >/dev/null 2>&1; do
                echo "Waiting for Keycloak readiness..."
                sleep 3
              done
      containers:
        - name: alexandria-server
          image: alexandria-server:local
          imagePullPolicy: IfNotPresent
          env:
            - name: HUB_DB_URL
              valueFrom:
                secretKeyRef:
                  name: alexandria-credentials
                  key: HUB_DB_URL
          args:
            - -config
            - /etc/alexandria/server.yaml
            - -listen
            - 0.0.0.0:8080
            - -base
            - https://hub.127.0.0.1.nip.io:8443
            - -issuer
            - https://auth.127.0.0.1.nip.io:8443/realms/alexandria
            - -db
            - $(HUB_DB_URL)
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: server-config
              mountPath: /etc/alexandria/server.yaml
              subPath: server.yaml
              readOnly: true
            - name: hub-data
              mountPath: /var/lib/alexandria/hub
          readinessProbe:
            httpGet:
              path: /pub/_vhub/v1/context.jsonld
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /pub/_vhub/v1/context.jsonld
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: server-config
          configMap:
            name: alexandria-server-config
        - name: hub-data
          persistentVolumeClaim:
            claimName: hub-data
---
apiVersion: v1
kind: Service
metadata:
  name: alexandria-server
  labels:
    app.kubernetes.io/name: alexandria-server
    app.kubernetes.io/part-of: alexandria
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alexandria-server
  ports:
    - name: http
      port: 8080
      targetPort: http
