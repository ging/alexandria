$kind: http-request
method: POST
url: '{{hubUrl}}/v1/namespaces/{{namespace}}/stewards'
order: 4000
headers:
- key: Content-Type
  value: application/json
body:
  type: text
  content: "{\n  \"iss\": \"{{idpUrl}}\",\n  \"sub\": \"sergio\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('201 Created or 409 STEWARD_EXISTS', () => pm.expect([201, 409]).to.include(pm.response.code));
