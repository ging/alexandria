$kind: http-request
method: POST
url: '{{hubUrl}}/v1/namespaces/{{namespace}}/drafts/{{draftId}}:propose'
order: 2000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test('201 Proposed', () => {\n  pm.response.to.have.status(201);\n  pm.collectionVariables.set('candidate2Id',\
    \ pm.response.json().id.split('/').pop());\n});"
