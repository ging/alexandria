$kind: http-request
description: |-
  F6 m2: only in 1.0.0: warning during the grace window, reject after it.
method: POST
url: '{{clientDsp}}/negotiations/request'
order: 2000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "@context": ["https://w3id.org/dspace/2025/1/context.jsonld", "{{profile}}/context.jsonld"],
      "@type": "ContractRequestMessage",
      "consumerPid": "urn:uuid:c-1",
      "offer": {
        "@id": "urn:uuid:offer-1",
        "@type": "Offer",
        "profile": "{{profile}}",
        "target": "urn:uuid:ds-1",
        "permission": [{"action": "ex:access"}]
      },
      "callbackAddress": "http://consumer/cb"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const v = pm.response.headers.get('VHub-Verdict');
      pm.test('a §4.8 decision: forward, forward-notice or reject', () => {
        if (pm.response.code === 200) {
          pm.expect(pm.response.json()['@type']).to.eql('Ack');
          if (v) pm.expect(v).to.match(/^warning;gate=[a-z_]+;code="[A-Z_]+"/);
        } else {
          pm.response.to.have.status(400);
          const e = pm.response.json();
          pm.expect(e['@type']).to.eql('ContractNegotiationError');
          pm.expect(e.code).to.match(/^[A-Z][A-Z0-9_]+$/);
          pm.expect(e.reason).to.be.an('array').that.is.not.empty;
          pm.expect(v).to.match(/^violation;gate=[a-z_]+;code="/);
        }
      });
      console.log(pm.info.requestName, '->', pm.response.code, v || '', pm.response.code === 400 ? pm.response.json().code : 'forward');
