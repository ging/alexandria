$kind: http-request
name: 'Transfer of A1 (agreement_admission)'
method: POST
url: '{{clientDsp}}/transfers/request'
order: 4000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "@context": ["https://w3id.org/dspace/2025/1/context.jsonld"],
      "@type": "TransferRequestMessage",
      "consumerPid": "urn:uuid:t-1",
      "agreementId": "urn:uuid:A1",
      "format": "HTTP_PULL",
      "callbackAddress": "http://consumer/cb"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const v = pm.response.headers.get('VHub-Verdict');
      pm.test('a §4.8 decision: forward, forward-notice or reject', () => {
        if (pm.response.code === 200) {
          pm.expect(pm.response.json()['@type']).to.eql('Ack');
          if (v) pm.expect(v).to.match(/^warning;gate=[a-z_]+;code="[A-Z_]+"/);
        } else {
          pm.response.to.have.status(400);
          const e = pm.response.json();
          pm.expect(e['@type']).to.eql('TransferError');
          pm.expect(e.code).to.match(/^[A-Z][A-Z0-9_]+$/);
          pm.expect(e.reason).to.be.an('array').that.is.not.empty;
          pm.expect(v).to.match(/^violation;gate=[a-z_]+;code="/);
        }
      });
      console.log(pm.info.requestName, '->', pm.response.code, v || '', pm.response.code === 400 ? pm.response.json().code : 'forward');
