$kind: collection
name: 'Vhub-client'
description: |-
  vhub-client admin API (§4.11) and DSP traffic through the dsp-ingress proxy (§4.7, §4.8).

  Start the fake connector, the hub and the client with the local configuration:
    make build
    ./bin/fake-connector -listen 127.0.0.1:8282
    ./bin/vhub-server -config config/server.json
    ./bin/vhub-client -config config/config.json -state-dir var/client/state -did.allow_insecure_localhost
  Publish the releases with the Vhub-server collection first. What the gates decide depends on the client
  clock (Onboarding before the first sync, NO_VERSION_IN_FORCE while 1.0.0 is Scheduled, and so on), so the
  DSP tests check the shape of every decision rather than one outcome; make demo replays F6 with fixed instants.
  dsp-egress is a forward proxy and needs an absolute request URI, which Postman cannot send per request,
  so it is left out.
variables:
  - key: 'profile'
    value: 'https://example.com/odrl/profile/f6'
    description: 'Policy profile every offer declares (language §5)'
auth:
  type: noauth
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      if (pm.response.headers.has('VHub-Verdict')) console.log('VHub-Verdict:', pm.response.headers.get('VHub-Verdict'));
