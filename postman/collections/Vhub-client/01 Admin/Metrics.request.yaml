$kind: http-request
method: GET
url: '{{clientAdmin}}/metrics'
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OpenMetrics exposition', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/openmetrics-text');
        pm.expect(pm.response.text()).to.include('vhub_listing_age_seconds').and.to.match(/# EOF\n$/);
      });
