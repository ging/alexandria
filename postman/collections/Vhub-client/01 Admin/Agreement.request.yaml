$kind: http-request
name: 'Get agreement A1'
method: GET
url: '{{clientAdmin}}/agreements/urn:uuid:A1'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with usable flag, or 404 if it was never imported', () => {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
        if (pm.response.code === 200) pm.expect(pm.response.json().usable).to.be.a('boolean');
      });
