$kind: http-request
name: 'Import an agreement on 1.0.0'
method: POST
url: '{{clientAdmin}}/agreements:import'
order: 7000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    [{"agreement_id": "urn:uuid:A1", "version": "1.0.0"}]
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 once the client knows 1.0.0, 404 before its first sync', () => pm.expect(pm.response.code).to.be.oneOf([200, 404]));
