$kind: http-request
name: '404 version not found'
method: GET
url: '{{hubUrl}}/v1/versions/9.9.9'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 API_NOT_FOUND', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().code).to.eql('API_NOT_FOUND');
      });
