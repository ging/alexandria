$kind: http-request
name: '422 revoked_from before R + P2D (REV-3)'
method: POST
url: '{{hubUrl}}/v1/versions/1.0.0:revoke'
order: 11000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {"justification": "too early on purpose", "revoked_from": "{{tomorrow}}"}
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{releaserToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('tomorrow', new Date(Date.now() + 24 * 3600 * 1000).toISOString().replace(/\.\d{3}Z$/, 'Z'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 DATES_REVOCATION_TOO_EARLY, or DATES_ALREADY_REVOKED after folder 08', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().code).to.be.oneOf(['DATES_REVOCATION_TOO_EARLY', 'DATES_ALREADY_REVOKED']);
      });
