$kind: http-request
name: '403 editor approves (REQ-HUB-003)'
method: POST
url: '{{hubUrl}}/v1/candidates/any:approve'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{editorToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('403 API_FORBIDDEN_ROLE', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().code).to.eql('API_FORBIDDEN_ROLE');
      });
