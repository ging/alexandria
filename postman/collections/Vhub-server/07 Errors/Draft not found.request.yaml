$kind: http-request
name: '404 draft not found'
method: GET
url: '{{hubUrl}}/v1/drafts/does-not-exist'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{editorToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 API_NOT_FOUND', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().code).to.eql('API_NOT_FOUND');
      });
