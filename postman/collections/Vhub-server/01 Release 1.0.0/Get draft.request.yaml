$kind: http-request
method: GET
url: '{{hubUrl}}/v1/drafts/{{draftId}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 returns the YAML source and its current ETag', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('ETag')).to.eql(pm.collectionVariables.get('draftEtag'));
        pm.expect(pm.response.text()).to.include('kind: SpaceProfile');
      });
