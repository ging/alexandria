$kind: http-request
method: POST
url: '{{hubUrl}}/v1/candidates/{{candidateId}}:approve'
order: 7000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {}
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{releaserToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('candidateId')) {
        console.log('no open candidate (re-run); skipping');
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 returns the signed version record (REQ-HUB-004, REQ-HUB-010)', () => {
        pm.response.to.have.status(201);
        const env = pm.response.json();
        pm.expect(env.signed.type).to.eql('eunomia.version/v1');
        pm.expect(env.signed.record.version).to.eql('1.0.0');
        pm.expect(env.signed.record.revoked_from).to.eql(null);
        pm.expect(env.signature.alg).to.eql('EdDSA');
        pm.expect(env.signature.kid).to.match(/^did:web:[^#]+#.+$/);
      });
      pm.collectionVariables.set('approvedCandidateId', pm.collectionVariables.get('candidateId'));
