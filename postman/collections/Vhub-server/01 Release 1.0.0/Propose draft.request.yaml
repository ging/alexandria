$kind: http-request
method: POST
url: '{{hubUrl}}/v1/drafts/{{draftId}}:propose'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.unset('candidateId');
      if (pm.response.code === 422) {
        pm.test('re-run: 1.0.0 is already released (VERSION_BUMP_TOO_LOW)', () => pm.expect(pm.response.json().code).to.eql('VERSION_BUMP_TOO_LOW'));
        return;
      }
      pm.test('201 freezes an open initial candidate with planned dates', () => {
        pm.response.to.have.status(201);
        const c = pm.response.json();
        pm.expect(c.state).to.eql('open');
        pm.expect(c.version).to.eql('1.0.0');
        pm.expect(c.class).to.eql('initial');
        pm.expect(c.manifest).to.match(/^ni:\/\/\/sha-256;[A-Za-z0-9_-]+$/);
        const nc = Date.parse(c.planned.new_content_from) - Date.parse(c.proposed_at);
        pm.expect(nc).to.eql(2 * 24 * 3600 * 1000);
        pm.expect(c.planned.enforced_from).to.eql(c.planned.new_content_from);
      });
      pm.collectionVariables.set('candidateId', pm.response.json().id);
