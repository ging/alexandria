$kind: http-request
name: 'Validate draft (N1-N5)'
method: POST
url: '{{hubUrl}}/v1/drafts/{{draftId}}:validate'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with a report', () => {
        pm.response.to.have.status(200);
        const r = pm.response.json();
        pm.expect(r.valid).to.be.a('boolean');
        pm.expect(r.findings).to.be.an('array');
        if (!r.valid) console.log('findings (already released on a re-run?)', r.findings.map(f => f.Code || f.code));
      });
