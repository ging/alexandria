$kind: http-request
method: POST
url: '{{hubUrl}}/v1/candidates/{{candidateId}}:approve'
order: 5000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {}
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{releaserToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('candidateId')) {
        console.log('no open candidate (re-run); skipping');
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 breaking record: enforced_from = new_content_from + P30D (§3.3)', () => {
        pm.response.to.have.status(201);
        const r = pm.response.json().signed.record;
        pm.expect(r.version).to.eql('2.0.0');
        pm.expect(r.class).to.eql('breaking');
        pm.expect(Date.parse(r.new_content_from) - Date.parse(r.published_at)).to.eql(2 * 24 * 3600 * 1000);
        pm.expect(Date.parse(r.enforced_from) - Date.parse(r.new_content_from)).to.eql(30 * 24 * 3600 * 1000);
      });
