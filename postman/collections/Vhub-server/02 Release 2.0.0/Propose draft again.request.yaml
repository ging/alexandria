$kind: http-request
method: POST
url: '{{hubUrl}}/v1/drafts/{{draftId2}}:propose'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.unset('candidateId');
      if (pm.response.code === 422) {
        pm.test('re-run: 2.0.0 is already released', () => pm.expect(pm.response.json().code).to.eql('VERSION_BUMP_TOO_LOW'));
        return;
      }
      pm.test('201 breaking candidate with a 30-day grace window', () => {
        pm.response.to.have.status(201);
        const c = pm.response.json();
        pm.expect(c.class).to.eql('breaking');
        const g = Date.parse(c.planned.enforced_from) - Date.parse(c.planned.new_content_from);
        pm.expect(g).to.eql(30 * 24 * 3600 * 1000);
      });
      pm.collectionVariables.set('candidateId', pm.response.json().id);
