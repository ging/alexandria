$kind: http-request
method: POST
url: '{{hubUrl}}/v1/drafts'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/yaml'
body:
  type: text
  content: |-
    # F6 release 2.0.0: ex:access goes deprecated in profile 1.1.0 (odrl:read adopted) and retired in profile 2.0.0.
    dsl: eunomia.profiles/v1
    kind: OdrlProfile
    profile:
      id: https://example.com/odrl/profile/f6
      version: 1.1.0
      title: { en: F6 demo policies }
      publisher: GING-DIT, Universidad Politécnica de Madrid
      license: https://creativecommons.org/licenses/by/4.0/
      base_url: https://example.com/odrl/profile/f6
    namespaces:
      ex: https://example.com/ns/f6#
    adopted:
      actions: [odrl:read]
    terms:
      - id: access
        kind: action
        included_in: odrl:use
        label: { en: Access }
        definition: { en: To access the asset. }
        status: deprecated
        replaced_by: odrl:read
    ---
    dsl: eunomia.profiles/v1
    kind: OdrlProfile
    profile:
      id: https://example.com/odrl/profile/f6
      version: 2.0.0
      title: { en: F6 demo policies }
      publisher: GING-DIT, Universidad Politécnica de Madrid
      license: https://creativecommons.org/licenses/by/4.0/
      base_url: https://example.com/odrl/profile/f6
    namespaces:
      ex: https://example.com/ns/f6#
    adopted:
      actions: [odrl:read]
    terms:
      - id: access
        kind: action
        included_in: odrl:use
        label: { en: Access }
        definition: { en: To access the asset. }
        status: retired
        replaced_by: odrl:read
    ---
    dsl: eunomia.profiles/v1
    kind: SpaceProfile
    space:
      id: https://example.com/spaces/demo
      version: 2.0.0
      title: { en: Demo data space }
      operator: https://example.com/party/demo-authority
      base_url: https://example.com/spaces/demo
    bindings:
      - slot: odrl
        profile: https://example.com/odrl/profile/f6
        source: internal
        version: "=2.0.0"
        obligation: mandatory
        conformance:
          - { role: json-schema, applies_to: policy_intake }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('draftId2', pm.response.json().id);
