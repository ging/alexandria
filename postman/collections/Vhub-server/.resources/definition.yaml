$kind: collection
description: |-
  vhub-server API (spec 0.2.1 §3.6 /v1, §3.7 /pub, Q15 DID document).

  Run the folders in order against a fresh hub started with config/server.json ("compiler": "dsl"):
    make build && ./bin/vhub-server -config config/server.json
  Folders 01 and 02 publish the F6 releases written in the eunomia.profiles/v1 YAML language
  (conformance/f6/drafts). Re-running them against the same hub is safe: proposals answer 422
  VERSION_BUMP_TOO_LOW and the approvals are skipped. Folder 08 revokes 1.0.0 and cannot be undone.

  Dates follow the hub clock. With the system clock a fresh 1.0.0 is Scheduled for two days, so
  /pub/{slug} answers 404 until a version is in force; start the hub with -clock-file to travel in time.
  Tokens are the PoC fixtures of config/tokens.json (DP-3, lab only).
variables:
  slug: demo
  version: 1.0.0
  profilePath: profiles/odrl/f6/1.0.0
  draftId: ""
  draftEtag: ""
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response.code >= 400) {
        pm.test('errors are problem+json typed by their catalog code', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
          const p = pm.response.json();
          if (p.code) pm.expect(p.type).to.eql('urn:eunomia:vhub:problem:' + p.code);
        });
      }
      pm.test('Date header comes from the hub clock', () => pm.expect(pm.response.headers.get('Date')).to.be.a('string'));
    language: text/javascript
