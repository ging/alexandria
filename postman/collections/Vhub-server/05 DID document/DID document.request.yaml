$kind: http-request
method: GET
url: '{{hubUrl}}/.well-known/did.json'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 did:web document', () => {
        pm.response.to.have.status(200);
        const d = pm.response.json();
        pm.expect(d.id).to.eql(pm.environment.get('hubDid'));
        pm.expect(d.verificationMethod[0].publicKeyJwk).to.include({kty: 'OKP', crv: 'Ed25519'});
      });
      if (pm.collectionVariables.get('listingKid')) {
        pm.test('the listing kid is an assertion key (REQ-HUB-010)', () => pm.expect(pm.response.json().assertionMethod).to.include(pm.collectionVariables.get('listingKid')));
      }
