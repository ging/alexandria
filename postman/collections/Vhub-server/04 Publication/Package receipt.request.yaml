$kind: http-request
method: GET
url: '{{hubUrl}}/pub/packages/{{manifestSegment}}/manifest.receipt'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('fake transparency receipt for this digest (DP-8, not SCITT)', () => {
        const r = pm.response.json();
        pm.expect(r.digest).to.eql('ni:///sha-256;' + pm.collectionVariables.get('manifestSegment'));
        pm.expect(r.log_id).to.eql('poc-log');
      });
