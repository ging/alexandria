$kind: http-request
name: 'Draft source (YAML)'
method: GET
url: '{{hubUrl}}/pub/{{slug}}/{{version}}/sources/draft.yaml'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('media type application/yaml', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/yaml'));
      pm.test('the package carries the YAML it was compiled from', () => pm.expect(pm.response.text()).to.include('dsl: eunomia.profiles/v1'));
