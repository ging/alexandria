$kind: http-request
method: GET
url: '{{hubUrl}}/pub/blobs/sha256/{{blobHex}}'
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('ETag is the requested hash', () => pm.expect(pm.response.headers.get('ETag')).to.eql('"' + pm.collectionVariables.get('blobHex') + '"'));
