$kind: http-request
method: GET
url: '{{hubUrl}}/pub/{{slug}}/{{version}}/{{profilePath}}/shapes.ttl'
order: 4100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('media type text/turtle', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/turtle'));
