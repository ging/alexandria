$kind: http-request
method: GET
url: '{{hubUrl}}/pub/packages/{{manifestSegment}}/manifest.json'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('the manifest digest is its ni: identifier', () => {
        const b64 = CryptoJS.SHA256(pm.response.text()).toString(CryptoJS.enc.Base64).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        pm.expect(b64).to.eql(pm.collectionVariables.get('manifestSegment'));
      });
