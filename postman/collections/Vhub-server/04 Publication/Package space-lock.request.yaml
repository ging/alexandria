$kind: http-request
method: GET
url: '{{hubUrl}}/pub/packages/{{manifestSegment}}/space-lock.json'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const sha = CryptoJS.SHA256(pm.response.text()).toString();
      pm.test('200 immutable, ETag = SHA-256 of the bytes (REQ-HUB-011)', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('immutable');
        pm.expect(pm.response.headers.get('ETag')).to.eql('"' + sha + '"');
      });
      pm.test('space-lock pins the manifest, the lifecycle and each binding (§13.2, Part 5.2)', () => {
        const l = pm.response.json();
        pm.expect(l.manifest).to.eql('ni:///sha-256;' + pm.collectionVariables.get('manifestSegment'));
        pm.expect(l.lifecycle.freshness.ttl).to.eql('P1D');
        pm.expect(l.bindings[0].slot).to.eql('odrl');
        pm.expect(l.bindings[0].artifacts.length).to.be.above(0);
      });
