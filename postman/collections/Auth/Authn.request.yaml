$kind: http-request
url: "{{baseUrl}}/api/v1/auth/token"
method: POST
body:
  type: urlencoded
  content:
    client_id: "{{client-id}}"
    client_secret: "{{client-secret}}"
scripts:
  - type: afterResponse
    code: |-
      const token = pm.response.json().access_token
      console.log(token)
      pm.environment.set("access_token", token)
    language: text/javascript
order: 1000
