$kind: http-request
method: POST
url: '{{clientAdmin}}/rules:explain'
order: 8000
headers:
- key: Content-Type
  value: application/json
body:
  type: text
  content: "{\n  \"listener\": \"dsp-ingress\",\n  \"method\": \"POST\",\n  \"path\": \"/negotiations/urn:uuid:p-1/request\"\
    ,\n  \"body\": {\n    \"@type\": \"ContractRequestMessage\",\n    \"providerPid\": \"urn:uuid:p-1\"\
    ,\n    \"consumerPid\": \"urn:uuid:c-1\",\n    \"action\": \"ex:access\"\n  }\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test('200 side-effect-free explain report (REQ-CLI-032)', () => {\n  pm.response.to.have.status(200);\n\
    \  const r = pm.response.json();\n  pm.expect(r.rule).to.eql('contract-request');\n  pm.expect(r.action).to.be.a('string');\n\
    });"
