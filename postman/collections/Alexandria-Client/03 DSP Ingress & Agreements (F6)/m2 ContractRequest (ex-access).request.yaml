$kind: http-request
method: POST
url: '{{clientIngress}}/negotiations/urn:uuid:p-1/request'
order: 2000
headers:
- key: Content-Type
  value: application/json
body:
  type: text
  content: "{\n  \"@type\": \"ContractRequestMessage\",\n  \"providerPid\": \"urn:uuid:p-1\",\n  \"consumerPid\"\
    : \"urn:uuid:c-1\",\n  \"action\": \"ex:access\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('200 ok/warning during coexistence or 400 violation after 2.0.0 enforced_from', () =>
    pm.expect([200, 400]).to.include(pm.response.code));
