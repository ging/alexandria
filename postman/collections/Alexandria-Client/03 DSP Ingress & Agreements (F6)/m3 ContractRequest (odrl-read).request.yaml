$kind: http-request
method: POST
url: '{{clientIngress}}/negotiations/urn:uuid:p-1/request'
order: 3000
headers:
- key: Content-Type
  value: application/json
body:
  type: text
  content: "{\n  \"@type\": \"ContractRequestMessage\",\n  \"providerPid\": \"urn:uuid:p-1\",\n  \"consumerPid\"\
    : \"urn:uuid:c-1\",\n  \"action\": \"odrl:read\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('400 VERDICT_VIOLATION under 1.0.0, 200 once 2.0.0 is in force', () => pm.expect([200,
    400]).to.include(pm.response.code));
