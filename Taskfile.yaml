version: "3"

tasks:
  default:
    cmds: [{ task: check }]

  fmt:
    desc: Format the code with gofumpt.
    cmds: ["go tool gofumpt -w ."]

  lint:
    desc: Run golangci-lint.
    cmds: ["go tool golangci-lint run"]

  test:
    desc: Run tests with the race detector and a coverage profile.
    cmds: ["go test -race -coverprofile=coverage.out ./..."]

  cover:
    desc: Open the coverage report in the browser.
    deps: [test]
    cmds: ["go tool cover -html=coverage.out"]

  build:
    desc: Build all project binaries (alexandriac, alexandria-server, alexandria-client, fake-idp, fake-connector) into bin/.
    cmds:
      - mkdir -p bin
      - go build -o bin/alexandriac ./cmd/alexandriac
      - go build -o bin/alexandria-server ./cmd/alexandria-server
      - go build -o bin/alexandria-client ./cmd/alexandria-client
      - go build -o bin/fake-idp ./deploy/fake-idp
      - go build -o bin/fake-connector ./deploy/fake-connector

  conformance:
    desc: Run the Vocabulary Hub conformance suite (T-*, N-*, and F6).
    cmds: ["go test ./conformance/..."]

  e2e:
    desc: Run the end-to-end F6 scenario test.
    cmds: ["go test -v ./conformance -run '^TestE2E_F6$'"]

  demo:
    desc: Build binaries and run the interactive F6 demo table.
    deps: [build]
    cmds: ["go run ./conformance/demo -bin-dir bin"]

  example:proxy:
    desc: Run the F6 scenario with alexandria-client as the L7 proxy (examples/proxy).
    deps: [build]
    cmds: ["go run ./examples/proxy -bin-dir bin"]

  example:envoy:
    desc: Run the F6 scenario with Envoy as the proxy and alexandria-client as validator (examples/envoy; needs envoy or Docker).
    deps: [build]
    cmds: ["go run ./examples/envoy -bin-dir bin"]

  trace:
    desc: Verify requirement traceability across TRACEABILITY.md and tests.
    cmds: ["go run ./conformance/trace"]

  clean:
    desc: Remove compiled binaries in bin/ and coverage artifacts.
    cmds: ["rm -rf bin coverage.out"]

  tidy:
    desc: Sync go.mod and go.sum.
    cmds: ["go mod tidy"]

  vuln:
    desc: Scan for known vulnerabilities.
    cmds: ["go run golang.org/x/vuln/cmd/govulncheck@latest ./..."]

  docs:dev:
    desc: Start the Fumadocs documentation dev server.
    dir: docs
    cmds: ["pnpm dev"]

  build:gui:
    desc: Build the console (gui/) and embed it in alexandria-server and alexandria-client under /ui/ (requires pnpm).
    deps: [build]
    cmds:
      - cd gui && pnpm install --frozen-lockfile && pnpm build:embed
      - go build -tags gui -o bin/alexandria-server ./cmd/alexandria-server
      - go build -tags gui -o bin/alexandria-client ./cmd/alexandria-client

  gui:dev:
    desc: Start the console with the Vite dev server and API proxies (http://localhost:5273).
    dir: gui
    cmds: ["pnpm install", "pnpm dev"]

  docs:build:
    desc: Build static documentation for GitHub Pages.
    dir: docs
    cmds: ["pnpm build"]

  tutorial:
    desc: Bootstrap tutorial/.venv, build Go binaries, and launch JupyterLab in the browser.
    deps: [build]
    cmds: ["./tutorial/run"]

  tutorial:exec:
    desc: Execute and verify the Jupyter notebooks in tutorial/ headlessly against the Go binaries.
    deps: [build]
    cmds: ["python3 ./tutorial/run.py exec -v"]

  all:
    desc: Build all binaries, run unit tests, conformance suite, and traceability check.
    cmds:
      - task: build
      - task: test
      - task: conformance
      - task: trace

  check:
    desc: "Full pipeline: format, lint, unit tests, conformance, and traceability."
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: conformance
      - task: trace
