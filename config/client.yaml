# Local development configuration for alexandria-client.
#
# Both YAML (.yaml / .yml) and JSON (.json) are accepted by alexandria-client,
# in either this section layout (common_config, did_config, observability,
# client_config) or the flat Appendix A.3 layout (see deploy/client.json).

common_config:
  hosts:
    http:
      # Default DSP ingress listener address when not overridden in listeners.
      protocol: "http"
      url: "127.0.0.1"
      port: "9080"
      internal_port: "9080"
    grpc: null
    graphql: null
  connection:
    is_local: true
    is_prod: false
    has_tls_proxy: false

# Hub DID trust anchor and DID document cache TTL (§4.5).
did_config:
  type: "key"
  hub_did: "did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH"
  did_ttl: "PT6H"

# Admin listener port, passive audit ring-buffer window, and event sink (§4.9–§4.10).
observability:
  log_level: "info"
  log_format: "auto"
  metrics: true
  pprof: false
  port: "9090"
  audit_window: 100
  events_sink: "file:var/client/events.jsonl"

# L7 DSP proxy configuration (Appendix A.3, §4.3.1).
client_config:
  class_id: "Provider"
  display: null
  trust:
    hub: "https://127.0.0.1:8443"
    namespace: "demo"
    context: "https://127.0.0.1:8443/pub/_vhub/v1/context.jsonld"
  upstreams:
    dsp: "http://127.0.0.1:8282/dsp"
  listeners:
    dsp-ingress:
      bind: "127.0.0.1:9080"
    dsp-egress:
      bind: "127.0.0.1:9081"
    admin:
      bind: "127.0.0.1:9090"
  rules:
    seed: "file:deploy/rules.seed.json"
  default_action: "forward"
  unknown_agreement: "forward"
  retention:
    gc_interval: "P1D"
